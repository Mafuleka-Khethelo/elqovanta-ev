# Local PostgreSQL for ChargeConnect.
# The database password is a local development default, not a production secret.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: chargeconnect
      POSTGRES_PASSWORD: chargeconnect
      POSTGRES_DB: chargeconnect
    ports:
      - "5432:5432"
    volumes:
      - chargeconnect_pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargeconnect -d chargeconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chargeconnect_pg:
